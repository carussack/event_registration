<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're registered | WHAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:40 25% 97%;
    --fg:195 30% 12%;
    --card:0 0% 100%;
    --primary:192 85% 26%;
    --accent:195 60% 92%;
    --border:195 15% 86%;
    --muted:195 12% 40%;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:24px;
    background:hsl(var(--bg));
    color:hsl(var(--fg));
    font-family:"Inter Tight",system-ui,-apple-system,sans-serif;
  }
  .card{
    width:100%;
    max-width:560px;
    text-align:center;
    background:hsl(var(--card));
    border:1px solid hsl(var(--border));
    border-radius:10px;
    padding:48px 32px;
  }
  .brand{
    margin:0;
    font-size:44px;
    font-weight:300;
    letter-spacing:.04em;
    color:hsl(var(--primary));
    line-height:1;
  }
  .brand sup{font-size:12px;vertical-align:super}
  h1{margin:28px 0 8px;font-size:28px;font-weight:600}
  .lede{margin:0 0 28px;font-size:15px;line-height:1.6;color:hsl(var(--muted))}
  .cal-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .cal-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:48px;
    padding:0 20px;
    border:1px solid hsl(var(--primary));
    border-radius:6px;
    background:transparent;
    color:hsl(var(--primary));
    font:500 14px/1 "Inter Tight",system-ui,sans-serif;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease;
  }
  .cal-btn:hover,.cal-btn:focus-visible{background:hsl(var(--accent));outline:none}
  .cal-btn svg{width:16px;height:16px;flex:none}
  .foot{margin:32px 0 0;font-size:12px;color:hsl(var(--muted))}
  .foot a{color:inherit}
  .foot strong{color:hsl(var(--fg))}
  @media (max-width:420px){
    .card{padding:36px 22px}
    .brand{font-size:36px}
    h1{font-size:24px}
    .cal-btn{width:100%}
  }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">WHAM<sup>®</sup></p>
    <h1>You're registered</h1>
    <p class="lede">We look forward to seeing you on January 12 for the program and reception, 2:00–6:00 PM Pacific Time.</p>

    <div class="cal-actions">
      <a class="cal-btn"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=WHAM%3A+The+Business+Case+for+AI-Driven+Precision+Health&amp;details=WHAM+at+the+JP+Morgan+Healthcare+Conference+%E2%80%94+featuring+insights+from+the+release+of+the+2027+WHAM+Report.+Program+2%3A00%E2%80%934%3A00+PM+PT%2C+Reception+4%3A00%E2%80%936%3A00+PM+PT+%28Pacific+Time%29.&amp;location=The+InterContinental+Hotel%2C+5th+Floor%2C+San+Francisco&amp;dates=20270112T140000%2F20270112T180000&amp;ctz=America%2FLos_Angeles"
         target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18M12 13v4M10 15h4"/></svg>
        Add to Google Calendar
      </a>

      <a class="cal-btn"
         href="https://outlook.office.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&amp;rru=addevent&amp;subject=WHAM%3A+The+Business+Case+for+AI-Driven+Precision+Health&amp;body=WHAM+at+the+JP+Morgan+Healthcare+Conference+%E2%80%94+featuring+insights+from+the+release+of+the+2027+WHAM+Report.+Program+2%3A00%E2%80%934%3A00+PM+PT%2C+Reception+4%3A00%E2%80%936%3A00+PM+PT+%28Pacific+Time%29.&amp;location=The+InterContinental+Hotel%2C+5th+Floor%2C+San+Francisco&amp;startdt=2027-01-12T14%3A00%3A00-08%3A00&amp;enddt=2027-01-12T18%3A00%3A00-08%3A00"
         target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18M12 13v4M10 15h4"/></svg>
        Add to Outlook Calendar
      </a>
    </div>

    <p class="foot"><strong>ABOUT WHAM:</strong> <a href="https://whamnow.org">WHAMNOW.ORG</a></p>
  </main>
</body>
</html>
